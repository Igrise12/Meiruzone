[project]
name = "ai-project-template"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "imapclient>=4.1.0",
    "joblib>=1.6.0",
    "pydantic>=2",
    "scikit-learn>=1.9.1",
    "uvicorn>=0.54.0",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
files = ["app/config.py", "app/models.py"]
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
check_untyped_defs = true
warn_unused_ignores = true

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "ipykernel>=6.30.1",
    "mypy>=2.4.0",
    "pip-audit>=2.10.1",
    "ruff>=0.16.10",
]
